name: geoguard_app
description: >
  Family safety companion app — manages GPS Tracking Chips and Alarm Buttons
  from a single account, with independent per-device configuration.
publish_to: 'none'
version: 0.2.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Backend (each family's own Firebase project)
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1

  # OpenStreetMap tiles + Nominatim address search (no API key needed)
  http: ^1.2.2
  geolocator: ^12.0.0

  # Local alerts (sound, vibration) and Android background monitoring
  flutter_local_notifications: ^17.2.1

  # Localization (English, French, Spanish, Italian, + extensible)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Utilities
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.3
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Localization is hand-written in lib/core/localization/ (no gen-l10n step).
  assets:
    - assets/icons/
    - firestore.rules
