# Builds an UNSIGNED iOS app on a Codemagic cloud Mac and packages it as an
# .ipa that testers install with Sideloadly (which signs it with their own
# Apple ID). No Apple Developer account or certificates are needed here.
workflows:
  ios-sideload:
    name: Grizzly iOS (unsigned IPA for Sideloadly)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze and test
        script: |
          flutter analyze
          flutter test
      - name: Build iOS (no code signing)
        script: flutter build ios --release --no-codesign
      - name: Package Grizzly.ipa
        script: |
          set -e
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry Grizzly.ipa Payload
          rm -rf Payload
    artifacts:
      - build/ios/ipa/Grizzly.ipa
